</head>
<body>
<header class="header">
  <a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.png" alt="ByteSeed logo"><span>Byte<span>Seed</span></span></a>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <nav id="nav">
    <a href="index.html#tools">Tools</a><a href="cv-builder.html">CV Builder</a><a href="templates.html">Templates</a>

  </nav>

<main>
<section class="section alt" id="html-compiler">
  <div class="section-heading"><p class="eyebrow">DEVELOPER TOOLS</p><h2>HTML Compiler</h2><p>Write HTML, CSS and JavaScript, then run it instantly - right in your browser.</p></div>
  <div class="compiler-panel">
    <div class="compiler-tabs">
      <button type="button" class="tab-btn active" data-tab="html">HTML</button>
      <button type="button" class="tab-btn" data-tab="css">CSS</button>
      <button type="button" class="tab-btn" data-tab="js">JavaScript</button>
    </div>
    <textarea id="compilerHtml" class="compiler-editor" data-panel="html" spellcheck="false">&lt;h1&gt;Hello, ByteSeed!&lt;/h1&gt;
&lt;p&gt;Edit the HTML, CSS and JavaScript tabs, then press Run.&lt;/p&gt;
&lt;button onclick="sayHi()"&gt;Click me&lt;/button&gt;</textarea>
    <textarea id="compilerCss" class="compiler-editor" data-panel="css" spellcheck="false" style="display:none">body{font-family:Arial,sans-serif;padding:24px;color:#17211d;background:#ffffff}
h1{color:#1c7a49}
button{padding:8px 16px;border-radius:8px;border:none;background:#1c7a49;color:#fff;cursor:pointer}</textarea>
    <textarea id="compilerJs" class="compiler-editor" data-panel="js" spellcheck="false" style="display:none">function sayHi(){
  alert("Hello from your ByteSeed HTML Compiler!");
}</textarea>
    <div class="btn-row">
      <button class="btn" id="compilerRun">Run</button>
      <button class="outline-btn" id="compilerReset">Reset</button>
    </div>
    <p class="compiler-output-label">Output</p>
    <iframe id="compilerFrame" class="compiler-frame" title="Preview" sandbox="allow-scripts allow-modals"></iframe>
  </div>
</section>
</main>
