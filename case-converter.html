<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert text between upper, lower, title and sentence case.">
  <title>Case Converter — ByteSeed</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.png" alt="ByteSeed logo"><span>Byte<span>Seed</span></span></a>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <nav id="nav">
    <a href="index.html#tools">Tools</a><a href="cv-builder.html">CV Builder</a><a href="templates.html">Templates</a>
    <a href="student-tools.html">Student Tools</a><a href="index.html#resources">Resources</a><a href="index.html#dreamy">Dreamy Designs</a>
  </nav>
</header>

<main>
<section class="section alt" id="case-converter">
  <div class="section-heading"><p class="eyebrow">TEXT TOOLS</p><h2>Case Converter</h2><p>Convert text between common letter cases.</p></div>
  <div class="tool-panel">
    <textarea id="ccInput" rows="7" placeholder="Type or paste text to convert..."></textarea>
    <div class="btn-row">
      <button class="outline-btn" data-case="upper">UPPERCASE</button>
      <button class="outline-btn" data-case="lower">lowercase</button>
      <button class="outline-btn" data-case="title">Title Case</button>
      <button class="outline-btn" data-case="sentence">Sentence case</button>
    </div>
    <div class="output-row">
      <textarea id="ccOutput" rows="7" placeholder="Converted text will appear here..." readonly></textarea>
      <button class="btn copy-btn" data-copy="ccOutput">Copy</button>
    </div>
  </div>
</section>
</main>
<footer><div class="footer-brand"><img class="brand-logo footer-logo" src="assets/logo.png" alt="ByteSeed logo"> ByteSeed</div><div class="footer-links"><a href="index.html#tools">Tools</a><a href="cv-builder.html">CV</a><a href="templates.html">Templates</a><a href="student-tools.html">Student Tools</a><a href="index.html#resources">Resources</a></div><p>© <span id="year"></span> ByteSeed. Built to grow.</p></footer>
<div class="toast" id="toast" role="status"></div>

</body>
</html>
