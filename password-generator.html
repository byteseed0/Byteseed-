<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate strong, random passwords with adjustable length and character sets.">
  <title>Password Generator — ByteSeed</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.png" alt="ByteSeed logo"><span>Byte<span>Seed</span></span></a>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <nav id="nav">
    <a href="index.html#tools">Tools</a><a href="cv-builder.html">CV Builder</a><a href="templates.html">Templates</a>
    <a href="student-tools.html">Student Tools</a><a href="index.html#resources">Resources</a><a href="index.html#dreamy">Dreamy Designs</a>
  </nav>
</header>

<main>
<section class="section alt" id="password-generator">
  <div class="section-heading"><p class="eyebrow">SECURITY TOOLS</p><h2>Password Generator</h2><p>Create a strong, random password.</p></div>
  <div class="tool-panel narrow">
    <div class="output-row">
      <input id="pgOutput" type="text" readonly placeholder="Your password will appear here">
      <button class="btn copy-btn" data-copy="pgOutput">Copy</button>
    </div>
    <label class="range-label">Length: <span id="pgLengthVal">16</span>
      <input id="pgLength" type="range" min="6" max="32" value="16">
    </label>
    <div class="check-grid">
      <label class="check"><input type="checkbox" id="pgUpper" checked> Uppercase (A-Z)</label>
      <label class="check"><input type="checkbox" id="pgLower" checked> Lowercase (a-z)</label>
      <label class="check"><input type="checkbox" id="pgNumbers" checked> Numbers (0-9)</label>
      <label class="check"><input type="checkbox" id="pgSymbols" checked> Symbols (!@#$)</label>
    </div>
    <div class="strength-bar"><div id="pgStrengthFill"></div></div>
    <p class="strength-label" id="pgStrengthLabel">Strength: —</p>
    <button class="btn" id="pgGenerate">Generate Password</button>
  </div>
</section>
</main>
<footer><div class="footer-brand"><img class="brand-logo footer-logo" src="assets/logo.png" alt="ByteSeed logo"> ByteSeed</div><div class="footer-links"><a href="index.html#tools">Tools</a><a href="cv-builder.html">CV</a><a href="templates.html">Templates</a><a href="student-tools.html">Student Tools</a><a href="index.html#resources">Resources</a></div><p>© <span id="year"></span> ByteSeed. Built to grow.</p></footer>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
